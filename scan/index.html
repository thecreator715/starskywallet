<script>// LUMA address layer. The ledger itself uses standard XRPL account IDs (20 bytes). LUMA wallet addresses are the
// same 20 bytes encoded with version byte 48, which always yields a 34-char address starting with "L".
// The panel translates L <-> r at its edge, so rippled and standard XRPL tooling keep working unchanged.
'use strict';
const ALPHABET = 'rpshnaf39wBUDNEGHJKLM4PQRST7VWXYZ2bcdeCg65jkm8oFqi1tuvAxyz';
const L_VERSION = 48, T_VERSION = 65, R_VERSION = 0;
// Two LUMA networks, two address families over the same 20-byte account IDs: Mainnet "L…" (version 48), Testnet "T…" (version 65).
// A Testnet address can never pass as a Mainnet one (different checksum payload), so funds cannot be sent to the wrong network by typo or paste.
const VERS = { L: L_VERSION, T: T_VERSION }; let ACTIVE = 'L';
function use(prefix) { if (!VERS[prefix]) throw new Error('unknown address prefix'); ACTIVE = prefix; }
const active = () => ACTIVE;

// pure-JS SHA-256 (no dependencies)
const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
const frac = x => Math.floor((x % 1) * 4294967296);
const K = primes.map(p => frac(Math.cbrt(p))), H0 = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
const rotr = (x, n) => (x >>> n) | (x << (32 - n));
function sha256(bytes) {
  const l = bytes.length, pl = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(pl);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(pl - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(pl - 4, (l * 8) >>> 0);
  const h = H0.slice(), w = new Array(64);
  for (let o = 0; o < pl; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10))) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  h.forEach((v, i) => ov.setUint32(i * 4, v >>> 0)); return out;
}

function b58encode(bytes) {
  let n = 0n; for (const b of bytes) n = (n << 8n) | BigInt(b);
  let s = ''; while (n > 0n) { s = ALPHABET[Number(n % 58n)] + s; n /= 58n; }
  for (const b of bytes) { if (b === 0) s = ALPHABET[0] + s; else break; }
  return s;
}
function b58decode(str) {
  let n = 0n;
  for (const ch of str) { const i = ALPHABET.indexOf(ch); if (i < 0) throw new Error('invalid character in address'); n = n * 58n + BigInt(i); }
  const hex = n.toString(16); const body = hex === '0' ? [] : hex.padStart(hex.length + (hex.length % 2), '0').match(/../g).map(h => parseInt(h, 16));
  let lead = 0; for (const ch of str) { if (ch === ALPHABET[0]) lead++; else break; }
  return Uint8Array.from([...new Array(lead).fill(0), ...body]);
}
function encodeAccount(id, version) {
  const payload = Uint8Array.from([version, ...id]);
  const chk = sha256(sha256(payload)).slice(0, 4);
  return b58encode(Uint8Array.from([...payload, ...chk]));
}
function decodeAccount(addr) {
  const raw = b58decode(String(addr));
  if (raw.length !== 25) throw new Error('invalid address length');
  const payload = raw.slice(0, 21), chk = sha256(sha256(payload)).slice(0, 4);
  for (let i = 0; i < 4; i++) if (chk[i] !== raw[21 + i]) throw new Error('invalid address checksum');
  return { version: payload[0], id: payload.slice(1) };
}
const R_RE = /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/, LT_RE = /^[LT][1-9A-HJ-NP-Za-km-z]{33}$/;
// 'r' | 'L' | 'T' | null for a well-formed, checksum-valid address
function kind(a) { try { a = String(a); const v = decodeAccount(a).version; if (v === R_VERSION && R_RE.test(a)) return 'r'; if (LT_RE.test(a)) return v === L_VERSION ? 'L' : v === T_VERSION ? 'T' : null; return null; } catch { return null; } }
const NETNAME = { L: 'LUMA Mainnet (L…)', T: 'LUMA Testnet (T…)' };
function isL(a) { return kind(a) === ACTIVE; }          // "is a LUMA address of the ACTIVE network"
function wrongNet(a) { const k = kind(a); return (k === 'L' || k === 'T') && k !== ACTIVE ? `That is a ${NETNAME[k]} address, but this is ${NETNAME[ACTIVE]}. Funds sent to it would not arrive.` : ''; }
function isR(a) { try { return R_RE.test(a) && decodeAccount(a).version === R_VERSION; } catch { return false; } }
function toL(a) { if (isL(a)) return a; if (!isR(a)) throw new Error('not a valid address'); return encodeAccount(decodeAccount(a).id, VERS[ACTIVE]); }
function toR(a) { if (isR(a)) return a; const w = wrongNet(a); if (w) throw new Error(w); if (!isL(a)) throw new Error('not a valid address'); return encodeAccount(decodeAccount(a).id, R_VERSION); }
// accepts an L or r address, returns the r form the ledger uses; throws a clear error otherwise
function normalize(a) {
  a = String(a || '').trim();
  if (isL(a) || isR(a)) return toR(a);
  const w = wrongNet(a); if (w) throw new Error(w);
  throw new Error(a ? `invalid address (expected a ${ACTIVE}… ${NETNAME[ACTIVE]} address; bad character or checksum)` : 'address required');
}
// convert every r-address string inside a JSON value to its L form (hashes/hex never match)
function deepToL(v) {
  if (typeof v === 'string') return R_RE.test(v) && isR(v) ? toL(v) : v;
  if (Array.isArray(v)) return v.map(deepToL);
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = deepToL(v[k]); return o; }
  return v;
}
const api = { sha256, encodeAccount, decodeAccount, isL, isR, toL, toR, normalize, deepToL, L_VERSION, T_VERSION, use, active, kind, wrongNet, NETNAME };
if (typeof module === 'object') module.exports = api; else globalThis.LumaAddr = api;
</script>

 else if(/^Offer/.test(ty))logAdd('dex',`${ty} by ${who}`,h,at);
 else if(/NFT/.test(ty))logAdd('nft',`${ty} by ${who}`,h,at);
 else if(/^MPT/.test(ty))logAdd('token',`${ty} by ${who}`,h,at);
 else if(ty!=='Payment')logAdd('other',`${ty} by ${who}`,h,at)}
function healthNote(i){if(!i)return;if(S.pState!=null&&i.server_state!==S.pState)logAdd('health',`Node state changed: ${S.pState} → ${i.server_state}`);S.pState=i.server_state;if(S.pPeers!=null&&i.peers!==S.pPeers)logAdd('health',`Peers ${S.pPeers} → ${i.peers}`);S.pPeers=i.peers;if(S.pQ!=null&&i.validation_quorum!==S.pQ)logAdd('health',`Validation quorum ${S.pQ} → ${i.validation_quorum}`);S.pQ=i.validation_quorum}
function watch(){const v=S.info&&S.info.validated_ledger;if(v&&v.age>20){if(!S.stall){S.stall=1;logAdd('health',`Network stalled: newest validated ledger is ${v.age}s old`)}}else if(S.stall){S.stall=0;logAdd('health','Network recovered: ledgers are validating again')}
 const now=Date.now();for(const [k,x] of Object.entries(S.vals)){const act=now-x.lastAt<20000;if(x.act&&!act){logAdd('health',`Validator ${short2(k)} went silent`)}if(!x.act&&act&&x.seen>1)logAdd('health',`Validator ${short2(k)} is validating again`);x.act=act}}
const short2=k=>k.length>14?k.slice(0,7)+'…'+k.slice(-5):k;
function onVal(j){const k=j.validation_public_key||j.master_key;if(!k)return;const x=S.vals[k]||(S.vals[k]={seen:0,first:Date.now(),agree:0,act:true});x.seen++;x.last=+j.ledger_index;x.lastAt=Date.now();x.hash=j.ledger_hash;const h=S.valHash[x.last];if(h&&h===j.ledger_hash)x.agree++;else if(h)x.dis=(x.dis||0)+1;if(S.tab===5&&!S.vt){S.vt=setTimeout(()=>{S.vt=0;if(S.tab===5)paint()},1500)}}
function paintLog(){const e=$('#logl');if(e)e.innerHTML=logHtml()}
function logHtml(){const q=($('#lgq')&&$('#lgq').value||'').toLowerCase();const L=S.log.filter(x=>!S.lf[x.kind]&&(!q||(x.msg+x.kind).toLowerCase().includes(q))).slice(0,200);return L.length?L.map(x=>`<div ${x.h?`onclick="showTx('${x.h}')"`:''}><span class="chip ${/fail|health/.test(x.kind)?'w':/token|amm|dex/.test(x.kind)?'b':'v'}">${esc(LOGK[x.kind]||x.kind)}</span><span style="flex:1;word-break:break-word">${esc(x.msg)}</span><span class="m">${new Date(x.at).toLocaleTimeString()}</span></div>`).join(''):'<div class="empty" style="display:block">No events yet. They appear as the network does things.</div>'}
function togLog(k){S.lf[k]=S.lf[k]?0:1;store.set('luma.scan.lf',JSON.stringify(S.lf));S.log=S.log;const f=$('#logf');if(f)f.innerHTML=logChips();paintLog()}
const logChips=()=>Object.entries(LOGK).map(([k,n])=>`<span class="chip ${S.lf[k]?'':'on'}" onclick="togLog('${k}')">${esc(n)}</span>`).join('');
function setWhale(v){S.whale=Math.max(1,+v||1000);store.set('luma.scan.whale',S.whale)}
function exportLog(){const rows=[['time','kind','event','tx']].concat(S.log.map(x=>[new Date(x.at).toISOString(),x.kind,x.msg,x.h||'']));const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='luma-'+S.net+'-activity-log.csv';a.click()}
function pLog(){if(!S.ok)return noNode();return `<h2>Activity log</h2><div class="t"><div class="row" style="flex-wrap:wrap"><input id="lgq" placeholder="Filter the log…" oninput="paintLog()" class="grow" style="min-width:10rem"><button class="pill" onclick="exportLog()">Export CSV</button></div><div class="fl" id="logf">${logChips()}</div><div class="row sub" style="margin-bottom:.4rem">Large payment threshold <input type="number" min="1" value="${S.whale}" style="width:7rem" onchange="setWhale(this.value)"> LUMA</div><div class="list lg" id="logl">${logHtml()}</div></div>`}
/* tokens seen on this network (from real transactions) */
const natv=a=>!a||a.currency==='XRP'||a.currency==='LUMA'&&!a.issuer;
function tokSee(a,t,ok,kind){if(!a||typeof a!=='object'||!a.currency||!a.issuer||natv(a))return;if(/^03/.test(a.currency)&&a.currency.length===40)return;const k=a.currency+'|'+a.issuer,x=S.tokens[k]||(S.tokens[k]={cur:a.currency,iss:a.issuer,tx:0,vol:0,holders:new Set(),first:Date.now(),last:0});x.tx++;x.last=Date.now();if(kind==='pay'&&a.value&&(!ok||ok==='tesSUCCESS'))x.vol+=+a.value;if(kind==='trust'&&+a.value&&t.Account)x.holders.add(t.Account)}
function tokTrack(t,ok){try{const ty=t.TransactionType;if(ty==='TrustSet')tokSee(t.LimitAmount,t,ok,'trust');else if(ty==='Payment'){tokSee(t.Amount,t,ok,'pay');tokSee(t.SendMax,t,ok,'x')}else if(ty==='OfferCreate'){tokSee(t.TakerGets,t,ok,'x');tokSee(t.TakerPays,t,ok,'x')}else if(ty==='AMMCreate'){tokSee(t.Amount,t,ok,'x');tokSee(t.Amount2,t,ok,'x')}}catch{}}
function tokHtml(){const q=(S.tq||'').trim().toLowerCase();const L=Object.entries(S.tokens).filter(([k,x])=>!q||(tname(x.cur)+' '+x.cur+' '+x.iss+' '+dispL(x.iss)).toLowerCase().includes(q)).sort((a,b)=>b[1].tx-a[1].tx).slice(0,150);return L.length?L.map(([k,x])=>`<div onclick="showToken('${esc(k)}')"><span class="chip v">${esc(tname(x.cur))}</span><span class="a">${esc(short(x.iss))}</span><span class="m">${x.tx} tx · ${x.holders.size} lines${x.vol?' · vol '+esc(fmt(x.vol,2)):''}</span></div>`).join(''):`<div class="empty" style="display:block">${q?'No token matching “'+esc(S.tq)+'” seen yet. Try scanning older ledgers, or paste the issuer address.':'No tokens seen yet. They appear when someone trades, trusts or pays a token.'}</div>`}
function paintTok(){const e=$('#tkl');if(e)e.innerHTML=tokHtml();const c=$('#tkc');if(c)c.textContent=Object.keys(S.tokens).length}
function tokQ(v){S.tq=v;paintTok()}
async function scanOlder(btn){if(!S.ok)return;btn.disabled=true;const top=S.ledgers.length?S.ledgers[S.ledgers.length-1].seq:0;let n=0;for(let k=1;k<=200&&top-k>1;k++){try{const r=await ask({command:'ledger',ledger_index:top-k,transactions:true,expand:true});for(const t of (r.ledger.transactions||[]))tokTrack(t,t.metaData&&t.metaData.TransactionResult);n++;if(k%20===0){btn.textContent='Scanned '+n+' ledgers…';paintTok()}}catch{break}}btn.textContent='Scanned '+n+' older ledgers';paintTok();btn.disabled=false}
function pTokens(){if(!S.ok)return noNode();return `<h2>Tokens</h2><div class="t"><div class="row" style="flex-wrap:wrap"><input id="tkq" value="${esc(S.tq)}" placeholder="Search a token name or issuer address" oninput="tokQ(this.value)" class="grow" style="min-width:10rem"><button class="pill" onclick="scanOlder(this)">Scan 200 older ledgers</button><button class="pill" onclick="tokOpen()">Open issuer</button></div><div class="sub" style="margin:.6rem 0"><b id="tkc">${Object.keys(S.tokens).length}</b> tokens seen on ${S.net==='main'?'Mainnet':'Testnet'} · discovered from real transactions</div><div class="list lg" id="tkl">${tokHtml()}</div></div>`}
function tokOpen(){const q=(S.tq||'').trim();try{const a=LumaAddr.normalize(q);showToken('|'+a)}catch{alert('Paste an issuer address (L… / T…) in the box first')}}
async function showToken(key){const [cur,iss]=key.split('|');const s=sheet(`<h2 style="margin-top:0">${esc(cur?tname(cur):'Issuer')} <span class="sub mono">${esc(short(iss))}</span></h2><div id="tkb" class="sub">loading…</div>`);
 try{const [ai,gw,ln]=await Promise.all([ask({command:'account_info',account:iss,ledger_index:'validated'}),ask({command:'gateway_balances',account:iss,ledger_index:'validated'}).catch(()=>({})),ask({command:'account_lines',account:iss,ledger_index:'validated',limit:400}).catch(()=>({lines:[]}))]);
  const obl=gw.obligations||{},mine=Object.entries(obl).filter(([c])=>!cur||c===cur),lines=(ln.lines||[]).filter(l=>!cur||l.currency===cur);const holders=lines.filter(l=>+l.balance<0).map(l=>({a:l.account,b:-l.balance})).sort((a,b)=>b.b-a.b);
  let price='–',pool='–';if(cur){try{const bo=await ask({command:'book_offers',taker_gets:{currency:cur,issuer:iss},taker_pays:{currency:'XRP'},limit:3});const o=(bo.offers||[])[0];if(o){const g=+o.TakerGets.value,p=+o.TakerPays/1e6;price=fmt(p/g,6)+' LUMA per '+tname(cur)}}catch{}try{const am=await ask({command:'amm_info',asset:{currency:'XRP'},asset2:{currency:cur,issuer:iss}});if(am.amm)pool='Pool '+fmt(+am.amm.amount/1e6,2)+' LUMA / '+fmt(+am.amm.amount2.value,2)+' '+tname(cur)}catch{}}
  const d=ai.account_data,t=S.tokens[key];
  s.querySelector('#tkb').outerHTML=`<div class="kv"><span>Issuer</span><b class="mono" style="word-break:break-all">${esc(dispL(iss))}</b></div><div class="kv"><span>Issuer LUMA balance</span><b>${fmt(d.Balance/1e6,4)}</b></div>${mine.map(([c,v])=>`<div class="kv"><span>Total issued (${esc(tname(c))})</span><b>${esc(fmt(v,6))}</b></div>`).join('')}<div class="kv"><span>Holders (trust lines)</span><b>${holders.length||lines.length}${(ln.marker?'+':'')}</b></div><div class="kv"><span>Best price</span><b>${esc(price)}</b></div><div class="kv"><span>AMM</span><b>${esc(pool)}</b></div>${t?`<div class="kv"><span>Seen in</span><b>${t.tx} tx · volume ${esc(fmt(t.vol,2))}</b></div>`:''}<div class="kv"><span>Flags</span><b>${(d.Flags&0x00800000)?'DefaultRipple ':''}${(d.Flags&0x00100000)?'Freeze ':''}${(d.Flags&0x00020000)?'RequireAuth ':''}${d.Domain?'domain '+esc(Buffer2(d.Domain)):''}</b></div>${holders.length?`<div class="k" style="margin-top:1rem">Top holders</div><div class="list">${holders.slice(0,10).map(h=>`<div onclick="document.querySelector('.sheet').remove();lookup('${h.a}')"><span class="a">${esc(short(h.a))}</span><span class="m">${esc(fmt(h.b,4))}</span></div>`).join('')}</div>`:''}<div class="row" style="margin-top:1rem"><button class="p" onclick="document.querySelector('.sheet').remove();lookup('${iss}')">Open issuer account</button></div>`}
 catch(e){s.querySelector('#tkb').textContent=/actNotFound/i.test(e.message)?'That account does not exist on this network.':e.message}}
function valHtml(){const now=Date.now(),L=Object.entries(S.vals).sort((a,b)=>b[1].lastAt-a[1].lastAt),act=L.filter(([k,x])=>now-x.lastAt<20000).length;const q=S.info&&S.info.validation_quorum;return `<div class="t"><div class="k">Validators</div><div class="sub" style="margin-bottom:.5rem"><b>${act}</b> active${q?' · quorum '+q:''} · seen from the live validation stream</div>${L.length?`<div class="list">${L.map(([k,x])=>{const a=now-x.lastAt<20000;return `<div><span class="chip ${a?'':'w'}">${a?'active':'silent'}</span><span class="a" title="${esc(k)}">${esc(short2(k))}</span><span class="m">ledger #${fmt(x.last)} · ${x.seen} votes · ${x.agree}${x.dis?'/'+x.dis+' off':' agree'}</span></div>`}).join('')}</div>`:'<div class="sub">Waiting for validations… (the node must forward its validation stream)</div>'}</div>`}
S.net=store.get('luma.scan.net')||LC.default||(/6106|test/i.test(S.url)?'test':'main');drawSw();go(0);connect();
</script>
